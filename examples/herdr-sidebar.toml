# Merge into ~/.config/herdr/config.toml
# Display half of Agents-panel grouping. Tokens are stamped by this plugin.

[ui]
agent_panel_sort = "spaces"

[ui.sidebar.agents]
rows = [
  [{ token = "$space_header", bold = true, dim = false }],
  [
    { token = "$badge_blocked", fg = "#f38ba8", bold = true, dim = false },
    { token = "$badge_working", fg = "#89b4fa", bold = true, dim = false },
    { token = "$badge_done", fg = "#a6e3a1", bold = true, dim = false },
    { token = "$badge_idle", fg = "#cdd6f4", bold = true, dim = false },
    { token = "tab", dim = false },
  ],
  ["$group_gap"],
]
